name: Build Nexus Kodi Skin

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nexus source
        uses: actions/checkout@v4

      - name: Check out Kodi 21 Omega Estuary base
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: f8815ee40f49a700c047982d752be4b2a61420e2
          path: upstream-kodi
          sparse-checkout: addons/skin.estuary
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build complete Nexus skin from the Kodi 21 base
        run: python tools/package_skin.py --base-skin upstream-kodi/addons/skin.estuary --output dist

      - name: Build the optional Nexus Glass variant
        run: python tools/package_glass.py --base-skin upstream-kodi/addons/skin.estuary --output dist

      - name: Prepare directly installable Kodi ZIP artifacts
        run: |
          mkdir -p dist/installable/classic dist/installable/glass
          unzip -q dist/skin.nexus-*.zip -d dist/installable/classic
          unzip -q dist/skin.nexus.glass-*.zip -d dist/installable/glass

      - name: Upload directly installable skin
        uses: actions/upload-artifact@v4
        with:
          name: nexus-kodi-skin
          path: dist/installable/**
          if-no-files-found: error
          retention-days: 30

      - name: Read Nexus skin version
        id: version
        run: |
          VERSION=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('skin.nexus/addon.xml').getroot().attrib['version'])")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish permanent versioned GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Nexus TV v${{ steps.version.outputs.value }}
          body: |
            Installable Nexus skin package for Kodi 21 Omega.

            Download **skin.nexus-${{ steps.version.outputs.value }}.zip** below and install it using Kodi's Add-ons → Install from zip file.

            The ZIP contains the `skin.nexus/` add-on folder at its root; it is directly installable and is not a nested Actions artifact.
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: dist/skin.nexus-*.zip dist/skin.nexus.glass-*.zip
